<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen-VL Worst Cases</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e8ee; --muted:#9aa3b2; --accent:#5b9dff; --gt:#4ade80; --pred:#f0883e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);
         border-bottom:1px solid var(--border);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header .spacer{flex:1}
  select,input,button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
         border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  .counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:90px;text-align:center}
  .layout{display:flex;height:calc(100vh - 53px)}
  .sidebar{width:320px;min-width:320px;border-right:1px solid var(--border);overflow-y:auto;background:var(--panel)}
  .item{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px}
  .item:hover{background:var(--panel2)}
  .item.active{background:#243043;border-left:3px solid var(--accent);padding-left:9px}
  .item .iid{color:var(--text);word-break:break-all;line-height:1.35}
  .item .meta{display:flex;gap:8px;align-items:center;margin-top:4px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .item .q{color:var(--muted);font-variant-numeric:tabular-nums}
  .main{flex:1;display:flex;overflow:hidden}
  .videoPane{flex:1.05;min-width:360px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
  .videoPane video{max-width:100%;max-height:100%}
  .noVideo{color:var(--muted);font-size:14px;text-align:center;padding:20px;line-height:1.6}
  .noVideo code{background:var(--panel2);padding:2px 6px;border-radius:5px}
  .detail{flex:1;min-width:340px;overflow-y:auto;padding:18px 20px;background:var(--bg)}
  .idline{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--muted);
          word-break:break-all;margin-bottom:12px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .chip{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px}
  .chip b{color:var(--muted);font-weight:500;margin-right:5px}
  .chip .v{font-variant-numeric:tabular-nums}
  .block{margin-bottom:16px}
  .block .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:700}
  .block .txt{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
              font-size:14px;line-height:1.6;white-space:pre-wrap}
  .gt .lbl{color:var(--gt)} .gt .txt{border-left:3px solid var(--gt)}
  .pred .lbl{color:var(--pred)} .pred .txt{border-left:3px solid var(--pred)}
  .hint{color:var(--muted);font-size:12px;margin-left:6px}
  kbd{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11px}
  .vbase{font-size:12px;width:230px}
</style>
</head>
<body>
<header>
  <h1>Qwen-VL Worst Cases</h1>
  <select id="filter"></select>
  <input id="search" placeholder="search id / text…" style="width:160px">
  <label class="hint">video base <input id="vbase" class="vbase" placeholder="videos/ or https://…"></label>
  <div class="spacer"></div>
  <button id="prev">‹ Prev</button>
  <div class="counter" id="counter">– / –</div>
  <button id="next">Next ›</button>
  <span class="hint">use <kbd>↑</kbd><kbd>↓</kbd></span>
</header>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="videoPane" id="videoPane"></div>
    <div class="detail" id="detail"></div>
  </div>
</div>
<script>
const DEFAULT_VIDEO_BASE = "videos/";
const CAT = {
  recognition_error:   {label:"Model error (GT valid)",    color:"#f0883e"},
  mislabel_model_right:{label:"GT wrong / model right",    color:"#e05561"},
  mislabel_review:     {label:"GT mismatch (review)",      color:"#c678dd"},
  corrupted:           {label:"Corrupted GT label",        color:"#d19a66"},
  refusal:             {label:"GT refusal",                color:"#8a94a6"},
  uncaptionable:       {label:"GT: identical frames",      color:"#56b6c2"},
  ok:                  {label:"OK",                        color:"#4ade80"},
};
const SCORE_ORDER=["quality","F1","CIDEr","METEOR","ROUGE_L","Bleu_1","Bleu_4","P","R"];
const GT_PROBLEM = ['refusal','uncaptionable','corrupted','mislabel_model_right','mislabel_review'];
const VALID_GT   = ['recognition_error','ok'];
let ALL=[], view=[], cur=0;

function videoBase(){
  let b = localStorage.getItem('vbase');
  if(b===null) b = DEFAULT_VIDEO_BASE;
  return b;
}
function videoUrl(c){
  let base = videoBase();
  if(base && !base.endsWith('/')) base += '/';
  const enc = c.video_rel.split('/').map(encodeURIComponent).join('/');
  return base + enc;
}
function catDot(c){const m=CAT[c]||CAT.ok;return `<span class="dot" style="background:${m.color}"></span>`;}

function passFilter(c){
  const f=document.getElementById('filter').value;
  const q=document.getElementById('search').value.trim().toLowerCase();
  let ok=true;
  if(f==='g_random')         ok = c.group==='random';
  else if(f==='g_worst')     ok = c.group==='worst';
  else if(f==='g_best')      ok = c.group==='best';
  else if(f==='valid')       ok = VALID_GT.includes(c.category);
  else if(f==='model_err')   ok = c.category==='recognition_error';
  else if(f==='gt_problems') ok = GT_PROBLEM.includes(c.category);
  else if(f==='problems')    ok = c.category!=='ok';
  else if(f!=='all')         ok = c.category===f;
  if(ok && q){
    ok = c.id.toLowerCase().includes(q) || c.gt.toLowerCase().includes(q)
         || c.prediction.toLowerCase().includes(q);
  }
  return ok;
}
function rebuild(){
  view = ALL.filter(passFilter);
  if(cur>=view.length) cur=0;
  renderList(); render();
}
function renderList(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML = view.map((c,i)=>`
    <div class="item ${i===cur?'active':''}" data-i="${i}">
      <div class="iid">${c.id}</div>
      <div class="meta">${catDot(c.category)}
        <span class="q">q=${c.quality.toFixed(1)}%</span>
        <span class="q">${c.source}</span>
      </div>
    </div>`).join('');
  sb.querySelectorAll('.item').forEach(el=>{
    el.onclick=()=>{cur=+el.dataset.i;render();syncActive();}
  });
}
function syncActive(){
  const sb=document.getElementById('sidebar');
  sb.querySelectorAll('.item').forEach((el,i)=>el.classList.toggle('active',i===cur));
  const act=sb.querySelector('.item.active');
  if(act) act.scrollIntoView({block:'nearest'});
}
function scoreChips(c){
  const s=Object.assign({quality:c.quality}, c.scores);
  return SCORE_ORDER.filter(k=>k in s).map(k=>{
    const disp = k==='quality'? c.quality.toFixed(1)+'%'
               : (k==='CIDEr' ? s[k].toFixed(3) : (s[k]*100).toFixed(1)+'%');
    return `<div class="chip"><b>${k}</b><span class="v">${disp}</span></div>`;
  }).join('');
}
function render(){
  const c=view[cur];
  document.getElementById('counter').textContent = view.length? `${cur+1} / ${view.length}` : '0 / 0';
  const vp=document.getElementById('videoPane');
  const dt=document.getElementById('detail');
  if(!c){vp.innerHTML='';dt.innerHTML='<div class="hint">No cases match the filter.</div>';return;}
  vp.innerHTML = c.has_video
     ? `<video src="${videoUrl(c)}" controls autoplay loop muted playsinline
                onerror="this.insertAdjacentHTML('afterend','<div class=\\'noVideo\\'>Could not load video.<br>Check the <b>video base</b> in the header.<br><code>'+this.src+'</code></div>');this.remove();"></video>`
     : `<div class="noVideo">no video for this case</div>`;
  const m=CAT[c.category]||CAT.ok;
  const pm = c.pred_matches_clip===true?'prediction matches clip'
           : c.pred_matches_clip===false?'prediction does NOT match clip':'';
  dt.innerHTML = `
    <div class="idline">${c.id}</div>
    <span class="badge" style="background:${m.color}22;color:${m.color};border:1px solid ${m.color}55">${m.label}</span>
    ${pm?`<span class="hint">· ${pm}</span>`:''}
    <div class="chips">${scoreChips(c)}</div>
    <div class="block gt"><div class="lbl">Ground Truth</div><div class="txt">${esc(c.gt)}</div></div>
    <div class="block pred"><div class="lbl">Qwen-VL zero-shot prediction</div><div class="txt">${esc(c.prediction)}</div></div>
    ${predBlock('Video prediction', c.pred_video, '#5b9dff')}
    ${predBlock('Motion prediction', c.pred_motion, '#c678dd')}
    ${predBlock('Video + Motion prediction', c.pred_both, '#56b6c2')}
  `;
}
function predBlock(label,text,color){
  if(!text) return '';
  return `<div class="block"><div class="lbl" style="color:${color}">${label}</div>`+
         `<div class="txt" style="border-left:3px solid ${color}">${esc(text)}</div></div>`;
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function move(d){ if(!view.length)return; cur=(cur+d+view.length)%view.length; render(); syncActive(); }

document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
document.getElementById('filter').onchange=rebuild;
document.getElementById('search').oninput=()=>{cur=0;rebuild();};
document.getElementById('vbase').oninput=e=>{localStorage.setItem('vbase',e.target.value);render();};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){move(1);e.preventDefault();}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){move(-1);e.preventDefault();}
});

document.getElementById('vbase').value = videoBase();

fetch('data.json').then(r=>r.json()).then(d=>{
  ALL=d;
  const counts={}; d.forEach(c=>counts[c.category]=(counts[c.category]||0)+1);
  const cnt=ks=>ks.reduce((s,k)=>s+(counts[k]||0),0);
  const fsel=document.getElementById('filter');
  const validN=cnt(VALID_GT), gtN=cnt(GT_PROBLEM), modelN=counts['recognition_error']||0;
  const gcount={}; d.forEach(c=>gcount[c.group]=(gcount[c.group]||0)+1);
  const worstN=gcount['worst']||0, bestN=gcount['best']||0, randomN=gcount['random']||0;
  const presets=[];
  if(randomN) presets.push(['g_random', `🎲 Random sample (${randomN})`]);
  if(worstN) presets.push(['g_worst', `🔻 Worst cases — diverse (${worstN})`]);
  if(bestN)  presets.push(['g_best',  `🏆 Best zero-shot (${bestN})`]);
  presets.push(
    ['valid',       `✅ Usable GT — worst first (${validN})`],
    ['model_err',   `🔴 Genuine model errors (${modelN})`],
    ['gt_problems', `⚠️ GT annotation problems (${gtN})`],
    ['problems',    `All problems (${d.length-(counts['ok']||0)})`],
    ['all',         `All (${d.length})`],
  );
  const singles=[];
  ['recognition_error','mislabel_model_right','mislabel_review','corrupted','refusal','uncaptionable','ok']
    .forEach(k=>{ if(counts[k]) singles.push([k,`${CAT[k].label} (${counts[k]})`]); });
  fsel.innerHTML =
    `<optgroup label="Views">`+presets.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')+`</optgroup>`+
    `<optgroup label="Single category">`+singles.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')+`</optgroup>`;
  // default: random sample if present, else worst, else usable-GT view
  fsel.value = randomN? 'g_random' : (worstN? 'g_worst' : (validN? 'valid' : (modelN? 'model_err' : 'all')));
  rebuild();
}).catch(e=>{
  document.getElementById('detail').innerHTML =
    '<div class="hint">Failed to load data.json ('+e+').<br>Serve the folder over http (GitHub Pages), not file://.</div>';
});
</script>
</body>
</html>
